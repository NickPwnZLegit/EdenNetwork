name: EdenNetwork Public Candidate Checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  public-safe-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared Eden account and DAO synthetic policy tests
        run: node --test tests/eden-account-gateway.test.mjs tests/dao-policy.test.mjs
      - name: Client and server JavaScript syntax
        run: |
          node --check api/eden-config.js
          node --check api/eden-registry.js
          node --check account/account.js
          node --check governance/governance.js
          node --check governance/dao-policy.mjs
      - name: Eden HOPE and EDEN token policy checks
        run: node --test tests/eden-token-scope.test.mjs
      - name: Public site and release gate tests
        run: node --test tests/public-site-release.test.mjs
