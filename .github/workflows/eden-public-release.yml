name: EdenNetwork Public Candidate Checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  public-safe-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public site and release gate tests
        run: node --test tests/public-site-release.test.mjs
